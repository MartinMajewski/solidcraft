# SolidCraft MM: a personal build of upstream main plus my open pull requests.
#
# Lives on the fork's default branch mm/tooling (scheduled workflows only run from the default
# branch, and keeping it off main keeps main a clean mirror of upstream). Each run:
#   sync   fast-forwards the fork's main to upstream, rebuilds mm/releases (mm/sync.sh) and pushes it
#   build  when mm/releases changed or has no build yet: builds the macOS app (mm/build-macos.sh)
#          and publishes it as a prerelease tagged mm-<version>-<date>-<sha>
#
# Needs the repository secret MM_SYNC_TOKEN: a fine-grained token for this fork only, with
# Contents and Workflows read/write. The built-in GITHUB_TOKEN may not push commits that change
# .github/workflows, and upstream's commits do. See README.md.
#
# Free: GitHub-hosted runners, macOS included, cost nothing on a public repository.
name: MM release build

on:
  schedule:
    - cron: "20 4 * * *" # 04:20 UTC, daily
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build even when mm/releases did not change"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mm-release-build
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Check the token
        env:
          MM_SYNC_TOKEN: ${{ secrets.MM_SYNC_TOKEN }}
        run: |
          if [ -z "$MM_SYNC_TOKEN" ]; then
            echo "::error::The repository secret MM_SYNC_TOKEN is missing (see README.md on mm/tooling)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: src
          fetch-depth: 0
          token: ${{ secrets.MM_SYNC_TOKEN }}
      - name: Rebuild mm/releases
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPO: ${{ github.repository }}
          FORK_REMOTE: origin
        run: |
          git -C src remote add upstream "https://github.com/${UPSTREAM_REPO:-tangency-labs/solidcraft}.git"
          tooling/mm/sync.sh --repo src --out out --push
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sync.outputs.sha }}
          FORCE: ${{ inputs.force_build }}
        run: |
          short="${SHA:0:7}"
          built="$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"mm-\") and endswith(\"-$short\"))] | length")"
          if [ "$FORCE" = true ] || [ "$built" = 0 ]; then echo "build=true" >>"$GITHUB_OUTPUT"
          else echo "build=false" >>"$GITHUB_OUTPUT"; echo "mm/releases ${short} is already built." >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Summary
        if: always()
        run: |
          if [ -f out/conflict.md ]; then cat out/conflict.md >>"$GITHUB_STEP_SUMMARY"
          elif [ -f out/manifest.md ]; then cat out/manifest.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: manifest
          path: out/*.md
          if-no-files-found: ignore

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          path: src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src -> target
          shared-key: mm-macos-aarch64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: manifest
      - name: Build SolidCraft MM
        id: build
        run: tooling/mm/build-macos.sh --src src --out dist --arch aarch64
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.MM_SYNC_TOKEN }}
          SHA: ${{ needs.sync.outputs.sha }}
          VERSION: ${{ steps.build.outputs.version }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          {
            echo "Personal build of SolidCraft: upstream main plus my open pull requests. Not an official release."
            echo
            cat manifest/manifest.md
            echo
            echo "Unsigned (ad-hoc). After dragging the app to Applications, run once:"
            echo
            echo '    xattr -dr com.apple.quarantine "/Applications/SolidCraft MM.app"'
          } >notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "SolidCraft MM $VERSION" --notes-file notes.md \
            "${{ steps.build.outputs.dmg }}" "${{ steps.build.outputs.cli_zip }}"
          echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >>"$GITHUB_STEP_SUMMARY"
